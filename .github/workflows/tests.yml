name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 這些測試刻意不碰資料庫——它們驗的是解析、接合與 Ground Truth，
      # 只讀 data/raw/ 的兩份 CSV。落庫與指標的正確性由本機的
      # load_postgres.py --verify（逐列 md5）與 compute_metrics.py 自檢負責。
      - name: Run tests
        run: pytest -q

      # --allow-growth 是必要的：EXPECTED 裡的 88 列／2026-04 是
      # **2026-08-02 那次量測的 Ground Truth 錨點**，而 committed 的快照會隨月更新前進。
      # 嚴格模式在這裡等於要求快照永遠停在錨點那一天，第一次月更新就會紅。
      # 真正的回歸防線是 pytest 裡對 2019-01／2026-04 兩個錨點的精確斷言，那不受影響。
      - name: Contract validation on the committed snapshot
        run: python src/validate_contracts.py --allow-growth

      - name: Splice check
        run: python src/splice_check.py

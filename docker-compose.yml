# 本專案的 PostgreSQL。啟動：docker compose up -d
#
# 憑證為「本機開發容器」用途，僅綁 127.0.0.1，不對外開放，故明文寫在此檔。
# 若要改，設定環境變數 PGPASSWORD_LOCAL 後重啟即可。

services:
  postgres:
    image: postgres:17
    container_name: broadband_pg
    environment:
      POSTGRES_DB: broadband
      POSTGRES_USER: broadband
      POSTGRES_PASSWORD: ${PGPASSWORD_LOCAL:-broadband_local_dev}
    ports:
      # 只綁 loopback，不暴露到區網
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broadband -d broadband"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
